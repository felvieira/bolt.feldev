services:
  app-prod:
    image: bolt-ai:production
    build:
      context: .
      dockerfile: Dockerfile
      target: bolt-ai-production
    ports:
      - '5173:5173'
    env_file: 
      - '.env'
      - '.env.local'
    environment:
      - NODE_ENV=production
      - COMPOSE_PROFILES=production
      # No strictly needed but serving as hints for Coolify
      - PORT=5173
      - GROQ_API_KEY=${GROQ_API_KEY}
      - HuggingFace_API_KEY=${HuggingFace_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPEN_ROUTER_API_KEY=${OPEN_ROUTER_API_KEY}
      - GOOGLE_GENERATIVE_AI_API_KEY=${GOOGLE_GENERATIVE_AI_API_KEY}
      - OLLAMA_API_BASE_URL=${OLLAMA_API_BASE_URL}
      - XAI_API_KEY=${XAI_API_KEY}
      - TOGETHER_API_KEY=${TOGETHER_API_KEY}
      - TOGETHER_API_BASE_URL=${TOGETHER_API_BASE_URL}
      - AWS_BEDROCK_CONFIG=${AWS_BEDROCK_CONFIG}
      - VITE_LOG_LEVEL=${VITE_LOG_LEVEL:-debug}
      - DEFAULT_NUM_CTX=${DEFAULT_NUM_CTX:-32768}
      - RUNNING_IN_DOCKER=true
      - CODEX_PROXY_URL=http://codex-proxy:3100
      - AUTH_SERVICE_URL=http://auth-service:3200
      - DEPLOY_SERVICE_URL=http://deploy-service:3300
      - DATABASE_URL=postgresql://bolt:${POSTGRES_PASSWORD:-bolt_secret_change_me}@postgres:5432/bolt_auth
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      - codex-proxy
      - auth-service
      - postgres
      - deploy-service
    command: pnpm run dockerstart
    profiles:
      - production

  app-dev:
    image: bolt-ai:development
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    env_file: 
      - '.env'
      - '.env.local'
    environment:
      - NODE_ENV=development
      - VITE_HMR_PROTOCOL=ws
      - VITE_HMR_HOST=localhost
      - VITE_HMR_PORT=5173
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - PORT=5173
      - GROQ_API_KEY=${GROQ_API_KEY}
      - HuggingFace_API_KEY=${HuggingFace_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPEN_ROUTER_API_KEY=${OPEN_ROUTER_API_KEY}
      - XAI_API_KEY=${XAI_API_KEY}
      - GOOGLE_GENERATIVE_AI_API_KEY=${GOOGLE_GENERATIVE_AI_API_KEY}
      - OLLAMA_API_BASE_URL=${OLLAMA_API_BASE_URL}
      - TOGETHER_API_KEY=${TOGETHER_API_KEY}
      - TOGETHER_API_BASE_URL=${TOGETHER_API_BASE_URL}
      - AWS_BEDROCK_CONFIG=${AWS_BEDROCK_CONFIG}
      - VITE_LOG_LEVEL=${VITE_LOG_LEVEL:-debug}
      - DEFAULT_NUM_CTX=${DEFAULT_NUM_CTX:-32768}
      - RUNNING_IN_DOCKER=true
      - CODEX_PROXY_URL=http://codex-proxy:3100
      - AUTH_SERVICE_URL=http://auth-service:3200
      - DEPLOY_SERVICE_URL=http://deploy-service:3300
      - DATABASE_URL=postgresql://bolt:${POSTGRES_PASSWORD:-bolt_secret_change_me}@postgres:5432/bolt_auth
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      - codex-proxy
      - auth-service
      - postgres
      - deploy-service
    volumes:
      - type: bind
        source: .
        target: /app
        consistency: cached
      - /app/node_modules
    ports:
      - '5173:5173'
    command: pnpm run dev --host 0.0.0.0
    profiles: ['development', 'default']

  app-prebuild:
    image: ghcr.io/stackblitz-labs/bolt.diy:latest
    ports:
      - '5173:5173'
    environment:
      - NODE_ENV=production
      - COMPOSE_PROFILES=production
      # No strictly needed but serving as hints for Coolify
      - PORT=5173
      - OLLAMA_API_BASE_URL=http://127.0.0.1:11434
      - DEFAULT_NUM_CTX=${DEFAULT_NUM_CTX:-32768}
      - RUNNING_IN_DOCKER=true
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    command: pnpm run dockerstart
    profiles:
      - prebuilt

  codex-proxy:
    image: bolt-codex-proxy:latest
    build:
      context: ./codex-proxy
      dockerfile: Dockerfile
    ports:
      - '3100:3100'
    environment:
      - CODEX_PROXY_PORT=3100
    volumes:
      # Persist codex sidecar OAuth tokens across restarts/deploys.
      # Codex ignores XDG_CONFIG_HOME and always writes to /root/.codex/
      # (state_5.sqlite contains the OAuth session tokens).
      - /var/lib/bolt-codex/codex-state:/root/.codex
      # Proxy session tokens + thread cache (per-user files)
      - /var/lib/bolt-codex/sessions:/app/.sessions
    restart: unless-stopped
    profiles: ['production', 'development', 'default']

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bolt_auth
      POSTGRES_USER: bolt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bolt_secret_change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - '5432'
    profiles: ['production', 'development', 'default']

  deploy-service:
    image: bolt-deploy-service:latest
    build:
      context: ./deploy-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: '3300'
    volumes:
      - deployments_data:/deployments
    expose:
      - '3300'
    profiles: ['production', 'development', 'default']

  auth-service:
    image: bolt-auth-service:latest
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://bolt:${POSTGRES_PASSWORD:-bolt_secret_change_me}@postgres:5432/bolt_auth
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production}
      PORT: '3200'
    expose:
      - '3200'
    profiles: ['production', 'development', 'default']


  # ─── Caddy reverse proxy (SSL + domain routing) ──────────────────────────
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - deployments_data:/deployments:ro
    depends_on:
      - app-prod
      - deploy-service
    profiles:
      - production

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  deployments_data:
